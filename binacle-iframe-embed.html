<div class="binacle-frame-wrap">
  <div class="binacle-loader" id="binacle-loader" role="status" aria-live="polite">
    <span aria-hidden="true"></span>
    <strong>Loading Binacle...</strong>
  </div>

  <iframe
    id="binacle-frame"
    src="https://your-binacle-host.example.com/?embed=1"
    title="Binacle Pokemon GO GBL helper"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>

<script>
const binacleIframe = document.getElementById("binacle-frame");
const binacleLoader = document.getElementById("binacle-loader");
const binacleLoaderText = binacleLoader ? binacleLoader.querySelector("strong") : null;
const binacleMaxRetries = 3;
const binacleRetryDelayMs = 7000;
let binacleRetryCount = 0;
let binacleReady = false;
let binacleRetryTimer = null;

function getBinacleOrigin() {
  if (!binacleIframe) return "";
  return new URL(binacleIframe.src, window.location.href).origin;
}

function showBinacleFrame() {
  binacleReady = true;
  window.clearTimeout(binacleRetryTimer);
  if (binacleLoader) binacleLoader.hidden = true;
  if (binacleIframe) binacleIframe.classList.add("is-loaded");
}

function resetBinacleFrame() {
  if (!binacleIframe || binacleReady) return;

  if (binacleRetryCount >= binacleMaxRetries) {
    if (binacleLoaderText) {
      binacleLoaderText.textContent = "Binacle is taking longer than expected. Refresh this page to try again.";
    }
    return;
  }

  binacleRetryCount += 1;
  if (binacleLoaderText) {
    binacleLoaderText.textContent = `Retrying Binacle... (${binacleRetryCount}/${binacleMaxRetries})`;
  }

  const nextUrl = new URL(binacleIframe.src, window.location.href);
  nextUrl.searchParams.set("embed", "1");
  nextUrl.searchParams.set("retry", Date.now().toString());
  binacleIframe.classList.remove("is-loaded");
  binacleIframe.src = nextUrl.toString();
  startBinacleWatchdog();
}

function startBinacleWatchdog() {
  window.clearTimeout(binacleRetryTimer);
  binacleRetryTimer = window.setTimeout(resetBinacleFrame, binacleRetryDelayMs);
}

window.addEventListener("message", event => {
  if (event.origin !== getBinacleOrigin()) return;
  if (!event.data || event.data.type !== "binacle:resize") return;

  showBinacleFrame();
  if (binacleIframe) {
    const nextHeight = Number(event.data.height) || 0;
    binacleIframe.style.height = `${Math.max(420, Math.min(nextHeight, 1800))}px`;
  }
});

startBinacleWatchdog();
</script>

<style>
.binacle-frame-wrap {
  position: relative;
  width: 100%;
  min-height: 420px;
}

#binacle-frame {
  display: block;
  width: 100%;
  height: 620px;
  border: 0;
  opacity: 0;
  transition: opacity 180ms ease;
}

#binacle-frame.is-loaded {
  opacity: 1;
}

.binacle-loader {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  gap: 12px;
  align-content: center;
  min-height: 420px;
  border: 1px solid #1d3f8f;
  border-radius: 8px;
  background: #3b68c3;
  color: #ffffff;
  font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.binacle-loader span {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255, 203, 5, 0.28);
  border-top-color: #ffcb05;
  border-radius: 50%;
  animation: binacle-spin 800ms linear infinite;
}

.binacle-loader[hidden] {
  display: none;
}

@keyframes binacle-spin {
  to { transform: rotate(360deg); }
}
</style>
